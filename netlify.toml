[build]
  command = "npm run build"
  publish = "dist"

[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/produk.html"
  to = "/produk"
  status = 301
  force = true

[[redirects]]
  from = "/blog.html"
  to = "/blog"
  status = 301
  force = true

[[redirects]]
  from = "/article.html"
  to = "/artikel/:id/"
  status = 301
  force = true
  query = { id = ":id" }

[[redirects]]
  from = "/article.html"
  to = "/blog"
  status = 301
  force = true

[[redirects]]
  from = "/berikut-cara-mengenal-roster-bangunan-dan-fungsinya/"
  to = "/blog"
  status = 301
  force = true

[[redirects]]
  from = "/jenis-roster-lubang-angin-harga-termurah/"
  to = "/produk"
  status = 301
  force = true
